
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me?</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6ee;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
.card {
  text-align: center;
  padding: 25px;
}
h1 { color: #e6005c; }
.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}
button {
  border: none;
  border-radius: 12px;
  padding: 13px 25px;
  font-size: 18px;
  cursor: pointer;
}
#yes { background: #ff4081; color: white; }
#no { background: white; color: #e6005c; }
#message { color: #e6005c; font-size: 22px; }
</style>
</head>
<body>
<div class="card">
  <h1>Do You Love Me? ❤️</h1>
  <p id="message">Please tell me!</p>
  <div class="buttons">
    <button id="yes" onclick="document.getElementById('message').textContent='I knew it! I love you too! ❤️🥰'">Yes</button>
    <button id="no">No</button>
  </div>
</div>
<script>
const no = document.getElementById('no');
no.addEventListener('click', function() {
  const x = Math.random() * (window.innerWidth - no.offsetWidth - 20) + 10;
  const y = Math.random() * (window.innerHeight - no.offsetHeight - 20) + 10;
  no.style.position = 'fixed';
  no.style.left = x + 'px';
  no.style.top = y + 'px';
});
</script>
</body>
</html>
